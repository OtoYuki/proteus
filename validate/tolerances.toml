# Contract between Proteus and the reference implementations. Loosen only with a written
# justification in validate/README.md.

# Cα radius of gyration vs mdtraj, Å (absolute).
rg_ca_abs = 0.01
# Total heavy-atom SASA vs mdtraj Shrake–Rupley (960 points/atom), relative.
sasa_vs_mdtraj_sr_rel = 0.01
# Total SASA vs FreeSASA Lee–Richards with its default ProtOr radii: a different algorithm
# *and* a different radius set, so this is an independent sanity check, not a tight bound.
# Observed 0.2–3.4 % over the corpus (see validate/README.md).
sasa_vs_freesasa_lr_rel = 0.04
# Backbone φ/ψ vs mdtraj, degrees (absolute); every angle must be within this.
phi_psi_abs_deg = 0.1
# Fraction of residues whose DSSP code agrees with mdtraj.
dssp3_min_agreement = 0.98
dssp8_min_agreement = 0.95
# Fraction of residues whose MolProbity Favored/Allowed/Outlier label agrees with cctbx ramalyze.
rama_label_min_agreement = 0.995
# Fraction of Proteus residues whose chain:resseq:icode key exists in the mdtraj residue list.
min_residue_key_match = 0.98

# Structures where a reference disagrees for a reason that is understood and is not a defect.
# Each entry names the exact checks it exempts and why; the harness prints every exemption it
# applies, so nothing is silently skipped. Global tolerances stay tight — that is the point of
# doing it per structure rather than by widening a threshold everyone else is held to.
#
# `checks` values: residue_count | sasa_mdtraj | sasa_freesasa | dssp8 | dssp3 | rama_labels

[[known_divergence]]
id = "1hrc"
checks = ["residue_count"]
reason = "mdtraj's is_protein counts the ACE acetyl cap as a residue; Proteus counts amino acids only. 104 vs 105 is that one cap."

[[known_divergence]]
id = "1znf"
checks = ["residue_count", "dssp8", "dssp3"]
reason = "Same ACE cap (25 vs 26). The DSSP gap follows from it: a 25-residue zinc-held domain has few residues, so one offset plus genuinely ambiguous turns near the metal site moves the fraction a long way. Kept in the corpus precisely because it is the hardest small case."

[[known_divergence]]
id = "1ten"
checks = ["residue_count", "dssp3"]
reason = "ARG802 has no CA atom in the deposited file (disordered N-terminus). Proteus requires a CA to place a residue on the backbone, which is what phi/psi, DSSP and the ribbon need; mdtraj's is_protein keeps it. 89 vs 90 is that residue, and the 97.8% DSSP-3 is the resulting one-residue offset."

[[known_divergence]]
id = "2rh1"
checks = ["residue_count", "sasa_mdtraj"]
reason = "A beta-2 adrenergic receptor with T4 lysozyme fused into the third intracellular loop, renumbered into the 1000s in one chain (gap 342 -> 1002). The two readers disagree by one residue across that junction, and one residue's surface is ~0.7% of the total, which is most of the 1.73% SASA gap. Same algorithm, same radii: the divergence is the residue set, not the kernel."

[[known_divergence]]
id = "1cag"
checks = ["sasa_freesasa", "rama_labels"]
reason = "Collagen. cctbx ramalyze classifies none of its residues (polyproline II with hydroxyproline is outside the Top8000 classes), so the reference is empty rather than disagreeing. FreeSASA's ProtOr radii diverge most on a thin triple helix that is almost entirely surface. Kept so that both facts stay visible instead of being discovered later."
