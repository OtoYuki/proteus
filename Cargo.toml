[workspace]
resolver = "2"
members = [
    "crates/proteus-core",
    "crates/proteus-storage",
    "crates/proteus-engine",
    "crates/proteus-server",
    "crates/proteus-cli",
    "crates/proteus-render",
    "crates/proteus-dssp",
    "crates/proteus-esm",
]

[workspace.package]
version = "0.7.0"
edition = "2021"
rust-version = "1.94"
authors = ["Sushant Hona <serotoninotonin@gmail.com>", "Proteus Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/OtoYuki/proteus"
homepage = "https://github.com/OtoYuki/proteus"
readme = "README.md"
keywords = ["bioinformatics", "protein-engineering", "biophysics", "terminal-graphics", "parquet"]
categories = ["science::bioinformatics", "command-line-utilities", "rendering::engine"]

[workspace.dependencies]
# Internal workspace crates
proteus-core = { path = "crates/proteus-core", version = "0.7.0" }
proteus-storage = { path = "crates/proteus-storage", version = "0.7.0" }
proteus-engine = { path = "crates/proteus-engine", version = "0.7.0" }
proteus-server = { path = "crates/proteus-server", version = "0.7.0" }
proteus-render = { path = "crates/proteus-render", version = "0.7.0" }
proteus-dssp = { path = "crates/proteus-dssp", version = "0.7.0" }
proteus-esm = { path = "crates/proteus-esm", version = "0.7.0" }

# Async runtime & networking
tokio = { version = "1.43", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = "0.7"
glob = "0.3"
futures-util = "0.3"
async-trait = "0.1"
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["trace", "cors"] }
subtle = "2"
form_urlencoded = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls", "webpki-roots", "http2"] }

# Serialization & Models
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.13", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Database & Storage
sqlx = { version = "0.9", default-features = false, features = ["sqlite", "runtime-tokio", "uuid", "chrono", "migrate"] }
parquet = { version = "60", default-features = false, features = ["arrow", "flate2-zlib-rs", "zstd"] }
arrow-schema = "60"
arrow-array = "60"
blake3 = "1.8"

# Container Orchestration
bollard = "0.21"

# Scientific & Math
candle-core = "0.11"
candle-nn = "0.11"
ureq = { version = "3", default-features = false, features = ["rustls"] }
pdbtbx = "0.12"
flate2 = "1"
nalgebra = "0.35"

# CLI & UX
clap = { version = "4.5", features = ["derive", "env"] }
indicatif = "0.18"
comfy-table = "8"
crossterm = "0.29"
base64 = "0.23"
unicode-width = "0.2"

# Diagnostics & Docs
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2.0"
anyhow = "1.0"
tempfile = "3.17"
toml = "1"
criterion = { version = "0.8", default-features = false, features = ["html_reports"] }
utoipa = { version = "5.3", features = ["uuid", "chrono"] }
utoipa-swagger-ui = { version = "9.0", features = ["axum"] }
