# cargo-deny configuration — https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # paste is unmaintained but still correct; pulled in by nalgebra → simba. No upstream fix yet.
    { id = "RUSTSEC-2024-0436", reason = "paste via nalgebra/simba; no maintained replacement upstream" },
    # atomic-polyfill is only reachable on no-std embedded targets we never build for.
    { id = "RUSTSEC-2023-0089", reason = "atomic-polyfill only in non-Linux/macOS target graphs" },
    # rsa via sqlx-mysql, present in Cargo.lock but never compiled (sqlite driver only).
    { id = "RUSTSEC-2023-0071", reason = "sqlx-mysql in lockfile via feature unification; not built" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "MPL-2.0",
    "OpenSSL",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
]
confidence-threshold = 0.8

[[licenses.clarify]]
crate = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
