# cargo-deny configuration — https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # paste is unmaintained but still correct; pulled in by nalgebra → simba. No upstream fix yet.
    { id = "RUSTSEC-2024-0436", reason = "paste via nalgebra/simba; no maintained replacement upstream" },
    # zip: all four concern ZipArchive::extract / ZipStreamReader::extract. Proteus only reads
    # .npz entries by name and writes archives (proteus-core/src/pae.rs). zip 8.6 is pinned by
    # candle-core 0.11 (the latest release); zip 3.0 is a build dependency of utoipa-swagger-ui,
    # which unpacks its own Swagger UI bundle entry by entry, not through extract(). Drop these
    # when candle moves to zip >= 9.
    { id = "RUSTSEC-2026-0367", reason = "zip extract() only; proteus never extracts archives" },
    { id = "RUSTSEC-2026-0368", reason = "zip extract() only; proteus never extracts archives" },
    { id = "RUSTSEC-2026-0369", reason = "zip extract() only; proteus never extracts archives" },
    { id = "RUSTSEC-2026-0429", reason = "zip extract() only; proteus never extracts archives" },
    # libsqlite3-sys bundles SQLite < 3.54.0, which can return stale page-cache memory for a
    # database opened beside a crafted -wal file. The fix is libsqlite3-sys >= 0.39, and sqlx 0.9.0
    # (the latest) caps it below 0.38. Proteus opens only its own proteus.db in its data
    # directory, never a database file someone else supplies. Drop this when sqlx allows 0.39.
    { id = "RUSTSEC-2026-0459", reason = "sqlx 0.9 caps libsqlite3-sys < 0.38; only our own proteus.db is opened" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "MPL-2.0",
    "OpenSSL",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
]
confidence-threshold = 0.8

# Our own crates name the data and fonts they embed (see their Cargo.toml and NOTICE files).
# Allowed for these two crates only, so a dependency under these terms still fails the check.
[[licenses.exceptions]]
crate = "proteus-bio-core"
allow = ["BSD-3-Clause-LBNL", "CC-BY-4.0"]

[[licenses.exceptions]]
crate = "proteus-bio-render"
allow = ["OFL-1.1"]

[[licenses.clarify]]
crate = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
