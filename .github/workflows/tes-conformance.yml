name: tes-conformance

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ga4gh-tes-1-1:
    name: GA4GH TES 1.1 compliance suite (container executor, Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p proteus-cli
      - name: Pre-pull alpine (Docker Hub anonymous pulls are rate-limited on hosted runners)
        run: |
          docker pull alpine:latest || (docker images --format '{{.Repository}}:{{.Tag}}' | grep '^alpine:' | head -1 | xargs -I{} docker tag {} alpine:latest)
          docker images | grep alpine
      - name: Start proteusd (container executor via /var/run/docker.sock)
        run: |
          mkdir -p /tmp/proteus-data
          PROTEUS_DATA_DIR=/tmp/proteus-data RUST_LOG=info \
            nohup target/release/proteus serve --port 8080 --allow-image 'alpine*' --allow-image 'docker.io/library/alpine*' \
            > /tmp/proteusd.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/v1/service-info && break; sleep 1; done
          curl -s http://127.0.0.1:8080/v1/service-info | python3 -m json.tool
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the ELIXIR/GA4GH compliance runner
        run: |
          git clone --depth 1 https://github.com/elixir-cloud-aai/openapi-test-runner /tmp/otr
          pip install /tmp/otr
      - name: Run the suite
        working-directory: /tmp/otr
        # The runner exits 1 even when every test passes, so the JSON report below is the gate.
        run: |
          mkdir -p /tmp/otr-report
          openapi-test-runner report --server http://127.0.0.1:8080/ --version 1.1.0 --output_path /tmp/otr-report \
            > /tmp/otr-stdout.txt 2>&1 || true
          sed 's/\x1b\[[0-9;]*m//g' /tmp/otr-stdout.txt | grep -E "Compliance Test-|Passed -|Failed -|Total Tests" || true
          test -f /tmp/otr-report/report.json
      - name: Fail on any failed test
        run: |
          python3 - <<'PY'
          import json, sys
          r = json.load(open('/tmp/otr-report/report.json'))
          s = r['summary']; print(s)
          sys.exit(1 if s.get('failed', 0) or s.get('unknown', 0) else 0)
          PY
      - name: Daemon log
        if: always()
        run: tail -n 100 /tmp/proteusd.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tes-compliance-report
          path: /tmp/otr-report/report.json

  sprocket-wdl:
    name: Sprocket (WDL) → TES backend → proteusd → container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p proteus-cli
      - name: Build the proteus image the WDL task runs in
        run: docker build -t ghcr.io/otoyuki/proteus:ci .
      - name: Start proteusd
        run: |
          mkdir -p /tmp/proteus-data /tmp/tes-store/in/file /tmp/tes-store/out
          PROTEUS_DATA_DIR=/tmp/proteus-data RUST_LOG=info \
            nohup target/release/proteus serve --port 8080 --allow-image 'ghcr.io/otoyuki/*' --no-pull \
            > /tmp/proteusd.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/v1/service-info >/dev/null && break; sleep 1; done
      - name: Install Sprocket
        run: |
          V=$(curl -s https://api.github.com/repos/stjude-rust-labs/sprocket/releases/latest | python3 -c "import sys,json; print(json.load(sys.stdin)['tag_name'])")
          curl -sL "https://github.com/stjude-rust-labs/sprocket/releases/download/$V/sprocket-$V-x86_64-unknown-linux-gnu.tar.gz" | tar xz
          find . -maxdepth 3 -name sprocket -type f -exec mv {} /usr/local/bin/sprocket \;
          sprocket --version
      - name: Run the WDL through the TES backend
        run: |
          sprocket run -c examples/wdl/sprocket.toml -s examples/wdl/analyze.wdl \
            @examples/wdl/inputs.json analyze_structure.image=ghcr.io/otoyuki/proteus:ci \
            --output-dir /tmp/sprocket-out | tee /tmp/sprocket.log
          grep -q "Radius of Gyration" /tmp/tes-store/out/*/work/metrics.txt
          grep "Ramachandran" /tmp/tes-store/out/*/work/metrics.txt
      - name: Daemon log
        if: always()
        run: tail -n 60 /tmp/proteusd.log
