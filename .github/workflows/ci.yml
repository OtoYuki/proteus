name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        toolchain: [stable]
        include:
          - os: ubuntu-latest
            toolchain: "1.94" # MSRV — keep in sync with rust-version in Cargo.toml
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: libsixel, so the Sixel encoder is checked by its own reference decoder
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsixel-bin
      - run: cargo nextest run --workspace --all-features
      - name: Sixel round-trip through libsixel
        if: runner.os == 'Linux'
        run: cargo test -p proteus-render --lib -- --ignored libsixel --nocapture
      - run: cargo test --workspace --doc

  lint:
    name: fmt + clippy + docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  viewer-js:
    name: browser viewer (node --test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # colour and mesh-decoding parity of core.js against fixtures written by proteus-render
      - run: node --test crates/proteus-render/assets/web/test/core.test.js

  browser:
    name: browser viewer (Chromium, Firefox, WebKit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p proteus-cli
      # Pages as users get them: a crystal structure with disulfides, a predicted model, and a
      # Cα-only simulated job.
      - name: viewer pages
        run: |
          mkdir -p pages
          P=target/debug/proteus
          export RUST_LOG=off PROTEUS_DATA_DIR="$RUNNER_TEMP/proteus-data"
          $P view crates/proteus-core/tests/data/1crn.pdb --html pages/1crn.html
          $P view crates/proteus-core/tests/data/edge/esm100_low.pdb --html pages/esm100_low.html
          job=$($P submit --fasta $'>ca\nMKTAYIAKQRQISFVKSHFSRQ' --runner simulated | grep -oE 'Job created: [0-9a-f-]+' | cut -d' ' -f3)
          $P view "$job" --html pages/simulated.html
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock playwright@1.55.0
      - run: npx playwright install --with-deps chromium firefox webkit
      # Script errors, a blank canvas, a hover label for a residue that does not exist, dead
      # keys; or, where a browser has no WebGL2, an incomplete fallback.
      - run: node scripts/browser-check.mjs pages/*.html

  supply-chain:
    name: cargo-deny + cargo-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-audit
      # plain cargo-audit honours .cargo/audit.toml (justified ignores); the check-run action does not
      - run: cargo audit

  coverage:
    name: coverage (llvm-cov → Codecov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info
      - uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
