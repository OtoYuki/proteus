name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  create-release:
    name: create GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/create-gh-release-action@v1
        with:
          changelog: CHANGELOG.md
          token: ${{ secrets.GITHUB_TOKEN }}

  binaries:
    name: ${{ matrix.target }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu,  os: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: x86_64-apple-darwin,       os: macos-15-intel }
          - { target: aarch64-apple-darwin,      os: macos-latest }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: proteus
          target: ${{ matrix.target }}
          tar: unix
          checksum: sha256
          token: ${{ secrets.GITHUB_TOKEN }}

  crates:
    name: crates.io
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # --no-verify: the packaged tarballs are compiled by the `package` job in ci.yml on
      # every push to main, so verifying all eight again here only costs minutes.
      #
      # A version already on crates.io cannot be replaced, and `cargo publish` errors on one
      # rather than skipping it (it only warns that the crate "already exists on crates.io
      # index", then uploads anyway). A tag for a version published by hand would therefore
      # fail the release, so this counts first and does nothing when the work is already done.
      - name: publish the workspace
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "No CARGO_REGISTRY_TOKEN secret: skipping the crates.io publish." >&2
            exit 0
          fi
          ver=$(cargo metadata --no-deps --format-version 1 \
                | jq -r '.packages[] | select(.name == "proteus-bio") | .version')
          mapfile -t crates < <(cargo metadata --no-deps --format-version 1 \
                | jq -r '.packages[] | select(.publish != []) | .name')
          live=0
          # 200 is published, 404 is not; anything else (a timeout, a 429) answers neither, and
          # counting it as "not published" would start a publish over versions that exist.
          for c in "${crates[@]}"; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --retry 3 -A "proteus-release" \
                     "https://crates.io/api/v1/crates/$c/$ver" || true)
            case "$code" in
              200) live=$((live + 1)) ;;
              404) ;;
              *) echo "crates.io answered '$code' for $c $ver; not guessing." >&2; exit 1 ;;
            esac
          done
          echo "$live of ${#crates[@]} crates are already on crates.io at $ver"
          if [ "$live" -eq "${#crates[@]}" ]; then
            echo "Nothing to publish."
            exit 0
          fi
          if [ "$live" -ne 0 ]; then
            echo "Half of $ver is published already. Cargo cannot resume that on its own:" >&2
            echo "finish it by hand with 'cargo publish -p <crate>' for the ones missing." >&2
            exit 1
          fi
          cargo publish --workspace --no-verify

  container:
    name: ghcr.io image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
