[package]
name = "proteus-bio-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
readme = "README.md"
description = "Headless Axum daemon (proteusd) with Server-Sent Events and OpenAPI documentation for Proteus."
repository.workspace = true
homepage.workspace = true
keywords = ["bioinformatics", "ga4gh", "tes", "openapi", "protein"]
categories = ["science::bioinformatics", "web-programming::http-server"]

# Published as proteus-bio-server; the library keeps its import name.
[lib]
name = "proteus_server"

[dependencies]
proteus-core = { workspace = true, features = ["openapi"] }
proteus-storage = { workspace = true }
proteus-engine = { workspace = true }
proteus-render = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
subtle = { workspace = true }
blake3 = { workspace = true }
form_urlencoded = { workspace = true }
base64 = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
utoipa = { workspace = true }
utoipa-swagger-ui = { workspace = true }

[dev-dependencies]
glob = { workspace = true }
reqwest = { workspace = true }
tempfile = { workspace = true }
