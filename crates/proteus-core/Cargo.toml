[package]
name = "proteus-bio-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
# Our code is MIT OR Apache-2.0. It embeds cctbx/geostd data (BSD-3-Clause-LBNL), the Top8000
# rotamer grids (CC-BY-4.0) and a port of sc-rs (MIT); see data/*/NOTICE.
license = "(MIT OR Apache-2.0) AND BSD-3-Clause-LBNL AND CC-BY-4.0 AND MIT"
readme = "README.md"
description = "Domain models, FASTA parsing, in-silico mutagenesis, and native biophysical calculations for Proteus."
repository.workspace = true
homepage.workspace = true
keywords = ["bioinformatics", "protein", "structure", "biophysics", "molprobity"]
categories = ["science::bioinformatics"]

# Published as proteus-bio-core; the library keeps its import name.
[lib]
name = "proteus_core"

[dependencies]
base64 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
pdbtbx = { workspace = true }
flate2 = { workspace = true }
nalgebra = { workspace = true }
proteus-dssp = { workspace = true, features = ["serde"] }
zip = { workspace = true }
utoipa = { workspace = true, optional = true }

[features]
default = []
openapi = ["dep:utoipa"]

[dev-dependencies]
tempfile = { workspace = true }
toml = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "biophysics"
harness = false
