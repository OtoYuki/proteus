[package]
name = "proteus-bio-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
readme = "README.md"
description = "Domain models, FASTA parsing, in-silico mutagenesis, and native biophysical calculations for Proteus."
repository.workspace = true
homepage.workspace = true
keywords = ["bioinformatics", "protein", "structure", "biophysics", "molprobity"]
categories = ["science::bioinformatics"]

# Published as proteus-bio-core; the library keeps its import name.
[lib]
name = "proteus_core"

[dependencies]
base64 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
pdbtbx = { workspace = true }
flate2 = { workspace = true }
nalgebra = { workspace = true }
proteus-dssp = { workspace = true, features = ["serde"] }
zip = { workspace = true }
utoipa = { workspace = true, optional = true }

[features]
default = []
openapi = ["dep:utoipa"]

[dev-dependencies]
tempfile = { workspace = true }
toml = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "biophysics"
harness = false
