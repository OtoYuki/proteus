[package]
name = "proteus-bio-py"
version = "0.12.0"
edition = "2021"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
repository = "https://github.com/OtoYuki/proteus"
description = "Python bindings for Proteus (the proteus-bio wheel on PyPI)."
# Shipped as a wheel, not as a crate.
publish = false

[lib]
name = "proteus_bio"
crate-type = ["cdylib"]

[dependencies]
proteus-core = { path = "../proteus-core", package = "proteus-bio-core" }
proteus-storage = { path = "../proteus-storage", package = "proteus-bio-storage" }
pyo3 = { version = "0.29", features = ["abi3-py310"] }
# The same major as proteus-storage's arrow, so its RecordBatch crosses to pyarrow without a copy.
arrow-pyarrow = "60"

# Kept out of the main workspace: a Python extension module does not link libpython, so it
# cannot be part of `cargo test --workspace`. Build it with maturin (see pyproject.toml).
[workspace]

[profile.release]
lto = "thin"
