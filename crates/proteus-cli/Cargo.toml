[package]
name = "proteus-bio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
readme = "README.md"
description = "Unified CLI binary for Proteus: mutation, screening, biophysical analysis, and terminal 3D inspection."
repository.workspace = true
homepage.workspace = true
keywords = ["bioinformatics", "protein-design", "alphafold", "boltz", "ipsae"]
categories = ["science::bioinformatics", "command-line-utilities"]

[[bin]]
name = "proteus"
path = "src/main.rs"

[features]
default = ["gpu"]
# `proteus film` renders frames on the GPU when one is present (wgpu; the CPU path is the
# fallback and the reference).
gpu = ["proteus-render/gpu"]

[dependencies]
proteus-core = { workspace = true }
proteus-storage = { workspace = true }
proteus-esm = { workspace = true }
proteus-engine = { workspace = true }
proteus-server = { workspace = true }
proteus-render = { workspace = true }
crossterm = { workspace = true }
ratatui = { workspace = true }
clap = { workspace = true }
glob = { workspace = true }
indicatif = { workspace = true }
comfy-table = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
pdbtbx = { workspace = true }
tempfile = { workspace = true }
png = { workspace = true }
