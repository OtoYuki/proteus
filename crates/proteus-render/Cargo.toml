[package]
name = "proteus-bio-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
readme = "README.md"
description = "Pure-Rust software 3D rasterizer, cartoon ribbon extruder, and terminal viewport engine for Proteus."
repository.workspace = true
homepage.workspace = true
keywords = ["bioinformatics", "protein", "terminal-graphics", "rasterizer", "molecular-viewer"]
categories = ["science::bioinformatics", "rendering", "visualization"]

# Published as proteus-bio-render; the library keeps its import name.
[lib]
name = "proteus_render"

[features]
# Render `proteus film` frames on the GPU (wgpu). The CPU rasteriser stays the reference.
gpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]

[dependencies]
proteus-core = { workspace = true }
nalgebra = { workspace = true }
pdbtbx = { workspace = true }
crossterm = { workspace = true }
base64 = { workspace = true }
flate2 = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
unicode-width = { workspace = true }
skrifa = { workspace = true }
ab_glyph_rasterizer = { workspace = true }
wgpu = { workspace = true, optional = true }
pollster = { workspace = true, optional = true }
bytemuck = { workspace = true, optional = true }
